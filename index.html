<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桂北·直营 季度经营看板（可上传版）</title>
<style>
/* ===== 以下为原看板样式，由构建脚本从 季度会看板-桂北直营/index.template.html 原样提取 ===== */
:root{
  --blue:#3370ff; --blue-2:#0e42d2; --gray:#f5f6f7; --line:#e5e6eb;
  --txt:#1d2129; --sub:#86909c; --red:#f53f3f; --green:#00b42a;
  --purple:#722ed1; --orange:#ff7d00; --teal:#14c9c9; --ink:#0b1f66;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--gray);color:var(--txt);line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
/* 头部 */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0e42d2,#3370ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.title h1{font-size:22px;font-weight:700;letter-spacing:.5px}
.title .sub{color:var(--sub);font-size:13px;margin-top:2px}
.meta-chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--sub);margin:4px 2px 0 0}
.no-print{white-space:nowrap}
button.act{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
button.act:hover{background:var(--blue-2)}
/* 导航 */
nav.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
nav.chips a{background:#fff;border:1px solid var(--line);color:#4e5969;border-radius:999px;padding:5px 12px;font-size:13px;text-decoration:none}
nav.chips a:hover{border-color:var(--blue);color:var(--blue)}
/* 卡片通用 */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.card h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.card h2 .tag{font-size:11px;font-weight:400;background:#eef3ff;color:var(--blue);border-radius:6px;padding:2px 8px}
.card .desc{color:var(--sub);font-size:12.5px;margin:2px 0 12px}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:#4e5969;margin:4px 0 8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart-scroll{overflow-x:auto}
svg{display:block;width:100%;height:auto}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.kpi .scope{font-size:11px;color:var(--blue);font-weight:600;letter-spacing:1px}
.kpi .label{color:var(--sub);font-size:12px;margin-top:6px}
.kpi .val{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:13px;color:var(--sub);font-weight:400;margin-left:2px}
.kpi .sub{font-size:12px;margin-top:6px;color:#4e5969}
.kpi .sub b.up{color:var(--green)} .kpi .sub b.down{color:var(--red)}
.kpi::after{content:"";position:absolute;right:-28px;top:-28px;width:90px;height:90px;border-radius:50%;background:rgba(51,112,255,.07)}
.kpi.hl::after{background:rgba(114,46,209,.08)}
/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#f7f8fa;color:#4e5969;font-weight:600;padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 10px;text-align:right;border-bottom:1px solid #f2f3f5;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.sum td{background:#fafbff;font-weight:700}
.tbl .hl td{background:#fff7f7}
.tbl .up{color:var(--green)} .tbl .down{color:var(--red)} .tbl .dim{color:var(--sub)}
.tbl-wrap{overflow-x:auto;margin-top:8px}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:start}
.grid2b{display:grid;grid-template-columns:1fr 1.35fr;gap:16px;align-items:start}
@media (max-width:980px){.grid2,.grid2b{grid-template-columns:1fr}}
/* 渠道堆叠条 */
.stack{height:44px;border-radius:9px;overflow:hidden;display:flex;margin:6px 0 4px;background:#f2f3f5}
.stack div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;white-space:nowrap;min-width:0}
.stack .thin{font-size:10.5px}
.legend .chips{display:flex;flex-wrap:wrap;gap:6px}
.legend .chips span{display:inline-flex;align-items:center;gap:4px;background:#f7f8fa;border-radius:6px;padding:2px 7px;font-size:11.5px;color:#4e5969}
.note{background:#f7f8fa;border-radius:8px;padding:9px 12px;font-size:12px;color:#4e5969;margin-top:10px}
.note b{color:var(--txt)}
.ai{background:linear-gradient(135deg,#eef3ff,#f7f4ff);border:1px solid #dfe8ff;border-radius:10px;padding:11px 14px;font-size:13px;color:#1d2129;margin-bottom:14px}
.ai .lab{font-weight:700;color:var(--blue-2);margin-right:6px}
.badge{display:inline-block;background:#e8ffea;color:#009a29;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;margin-left:6px}
.badge.red{background:#ffece8;color:#d91f1f}
.badge.gray{background:#f2f3f5;color:#4e5969}
.qline{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:#4e5969;margin-top:6px}
.qline b.up{color:var(--green)} .qline b.down{color:var(--red)}
/* 品项占比 */
.hb{margin-bottom:2px}
.hb-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:#4e5969;margin:2px 0 1px}
.hb-top .hb-name{font-weight:600;color:var(--txt)}
.hb-top .hb-v{color:var(--sub);font-size:12px}
.hb-bar{height:15px;background:#eef0f3;border-radius:8px;overflow:hidden;margin-bottom:9px}
.hb-bar>div{height:100%;border-radius:8px}
.slicer{display:flex;gap:6px;margin:2px 0 10px;flex-wrap:wrap}
.slicer button{border:1px solid #d9d9d9;background:#fff;border-radius:999px;padding:4px 13px;font-size:12.5px;cursor:pointer;color:#4e5969}
.slicer button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.rank-row{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:3px 0}
.rank-no{flex:none;width:22px;height:22px;border-radius:7px;background:#eef0f3;color:#4e5969;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px}
.rank-no.t{background:var(--blue);color:#fff}
.rank-no.t2{background:#a3c0ff;color:#fff}
.rank-no.t3{background:#cfe0ff;color:#0e42d2}
.rank-name{flex:none;width:235px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-track{flex:1;background:#f2f3f5;border-radius:8px;height:16px;overflow:hidden}
.rank-track>div{height:100%;border-radius:8px;background:var(--blue)}
.rank-val{flex:none;width:120px;text-align:right;color:#4e5969;font-variant-numeric:tabular-nums}
.rank-val b{color:var(--txt)}
footer{color:var(--sub);font-size:12px;margin-top:6px}
footer li{margin:3px 0;list-style:none;padding-left:12px;position:relative}
footer li::before{content:"·";position:absolute;left:0;color:var(--blue)}
@media print{
  body{background:#fff}
  .no-print,nav.chips{display:none!important}
  .card{box-shadow:none;break-inside:avoid;border-color:#d9d9d9}
  .wrap{max-width:100%;padding:0}
}
</style>
<style>
/* ===== 可上传版新增样式（不影响原看板排版） ===== */
.appbar{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(15,23,42,.05)}
.appbar-in{max-width:1280px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.app-tabs{display:flex;gap:6px;flex:1}
.app-tabs button{border:1px solid var(--line);background:#fff;color:#4e5969;border-radius:999px;padding:6px 15px;font-size:13.5px;cursor:pointer;font-family:inherit}
.app-tabs button:hover{border-color:var(--blue);color:var(--blue)}
.app-tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.app-actions{display:flex;align-items:center;gap:8px}
.app-status{font-size:12px;color:var(--sub);display:inline-flex;align-items:center;gap:6px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-status .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.app-status.warn .dot{background:var(--orange)}
.app-status.warn{color:#d25f00}
.app-status.err .dot{background:var(--red)}
.app-status.err{color:var(--red)}
button.act.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
button.act.ghost:hover{background:#eef3ff}
button.act.gray{background:#fff;color:#4e5969;border:1px solid var(--line)}
button.act.gray:hover{background:var(--gray)}
.pane[hidden]{display:none!important}
/* 抽屉 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:80}
.mask[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:#f7f8fa;z-index:90;box-shadow:-8px 0 30px rgba(15,23,42,.16);display:flex;flex-direction:column}
.drawer[hidden]{display:none}
.drawer-hd{padding:14px 18px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer-hd h3{font-size:15.5px;font-weight:700}
.drawer-bd{padding:14px 18px 40px;overflow:auto;flex:1}
.drawer-bd h4{font-size:13px;font-weight:700;color:#4e5969;margin:16px 0 8px;letter-spacing:.3px}
.drawer-bd h4:first-child{margin-top:0}
.xbtn{border:0;background:transparent;font-size:20px;line-height:1;color:var(--sub);cursor:pointer;padding:2px 6px}
.slot{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.slot .nm{flex:1;min-width:0}
.slot .nm b{display:block;font-size:13px}
.slot .nm span{display:block;font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .tagx{font-size:11px;border-radius:6px;padding:2px 7px;background:#f2f3f5;color:#4e5969;flex:none}
.slot .tagx.ok{background:#e8ffea;color:#009a29}
.slot .tagx.no{background:#fff1e8;color:#d25f00}
.slot button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--blue);flex:none;font-family:inherit}
.slot button:hover{background:#eef3ff}
.drop{border:1.5px dashed #b9c2d0;border-radius:12px;background:#fff;padding:18px 14px;text-align:center;color:#4e5969;font-size:13px;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--blue);background:#f5f8ff;color:var(--blue)}
.drop small{display:block;color:var(--sub);font-size:11.5px;margin-top:5px}
.chk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.8}
.chk .row{display:flex;justify-content:space-between;gap:10px}
.chk .okv{color:var(--green);font-weight:600}
.chk .bad{color:var(--red);font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
/* 自助分析 */
.filters{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.filters .frow{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-start}
.filters .frow:last-child{margin-bottom:0}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:30px}
.fgroup>label{font-size:12.5px;color:#4e5969;font-weight:600;flex:none}
.fgroup select{font-family:inherit;font-size:13px;padding:5px 9px;border:1px solid #d9d9d9;border-radius:8px;background:#fff;color:var(--txt);min-width:110px}
.fgroup input[type=text]{font-family:inherit;font-size:13px;padding:6px 10px;border:1px solid #d9d9d9;border-radius:8px;min-width:150px}
.pill{border:1px solid #d9d9d9;background:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;color:#4e5969;font-family:inherit}
.pill:hover{border-color:var(--blue);color:var(--blue)}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.kpis2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpis2 .k2{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.kpis2 .k2 .lb{font-size:12px;color:var(--sub)}
.kpis2 .k2 .vl{font-size:21px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.kpis2 .k2 .vl small{font-size:12px;color:var(--sub);font-weight:400;margin-left:3px}
.kpis2 .k2 .sb{font-size:11.5px;color:#4e5969;margin-top:3px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.export{display:flex;gap:8px;align-items:center;margin:10px 0 0}
.pager{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#4e5969;margin:8px 0}
.pager button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 10px;cursor:pointer;font-family:inherit;font-size:12.5px}
.pager button:disabled{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#1d2129;color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:120;pointer-events:none;max-width:80vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media print{
  .appbar,.drawer,.mask{display:none!important}
  .pane[hidden]{display:none!important}
}
</style>
</head>
<body>

<div class="appbar no-print">
  <div class="appbar-in">
    <div class="app-tabs">
      <button data-tab="board" class="on">经营看板</button>
      <button data-tab="analysis">自助分析</button>
      <button data-tab="detail">明细数据</button>
    </div>
    <div class="app-actions">
      <span class="app-status" id="dataStatus"><span class="dot"></span><span id="dataStatusTxt">正在加载…</span></span>
      <button class="act ghost" id="btnData">数据管理</button>
    </div>
  </div>
</div>

<div id="boardRoot" class="pane"></div>
<div id="analysisRoot" class="pane" hidden></div>
<div id="detailRoot" class="pane" hidden></div>

<div class="mask" id="drawerMask" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <div class="drawer-hd">
    <h3>数据管理 · 上传即更新</h3>
    <button class="xbtn" id="drawerClose" title="关闭">×</button>
  </div>
  <div class="drawer-bd" id="drawerBody"></div>
</aside>

<div class="toast" id="toast"></div>

    gbKpi.q1q2_yoy = cumSame ? pct(cumOut / cumSame - 1) : null;
    gbKpi.qoq = qPrev.out ? pct((qLast.out - qPrev.out) / qPrev.out) : null;
    gbKpi.qoq_from = qPrev.quarter;
    gbKpi.qoq_to = qLast.quarter;

    var directRows = periodRows(directRowsAll, '区域', '直营区域', PERIODS);
    var dSum = summarizeRows(directRows);
    var dMonths = dSum.months, dQuarters = dSum.quarters;
    dMonths.forEach(function (m) {
      if (m.same <= 0 || m.yoy === null) m.isNew = true;
    });
    var dKpi = kpiFromFinal(directRowsAll, '区域', '直营区域');
    var dq1 = dQuarters[0], dq2 = dQuarters[1];
    var dqLast = dQuarters[dQuarters.length - 1], dqPrev = dQuarters[dQuarters.length - 2] || dQuarters[0];
    var dMonthsComparable = dMonths.filter(function (m) { return !m.isNew; });
    dKpi.since5_out = r2(dMonthsComparable.reduce(function (a, m) { return a + m.out; }, 0));
    dKpi.since5_same = r2(dMonthsComparable.reduce(function (a, m) { return a + m.same; }, 0));
    dKpi.since5_yoy = dKpi.since5_same ? pct((dKpi.since5_out - dKpi.since5_same) / dKpi.since5_same) : null;
    dKpi.since5_months = dMonthsComparable.map(function (m) { return m.month; });
    dKpi.qoq = dqPrev.out ? pct((dqLast.out - dqPrev.out) / dqPrev.out) : null;

    var mgrList = [];
    mgrSheets.forEach(function (sheet) {
      var rows = periodRows(sheet.rows, '销售经理', sheet.name, PERIODS);
      var s = summarizeRows(rows);
      var months = s.months, qs = s.quarters;
      if (!qs.length) return;
      var q1m = qs[0], q2m = qs[1];
      var half = {
        task: r2(q1m.task + q2m.task),
        same: r2(q1m.same + q2m.same),
        out: r2(q1m.out + q2m.out),
        achv: (q1m.task + q2m.task) ? pct((q1m.out + q2m.out) / (q1m.task + q2m.task)) : null,
        yoy: (q1m.same + q2m.same) ? pct((q1m.out + q2m.out) / (q1m.same + q2m.same) - 1) : null
      };
      mgrList.push({
        name: sheet.name, q1: q1m, q2: q2m, half: half,
        cum: r2(months.reduce(function (a, m) { return a + m.out; }, 0))
      });
    });
    mgrList.sort(function (a, b) { return b.cum - a.cum; });

    /* ===== 明细口径：渠道 / 客户 / 328 ===== */
    var det26 = detRowsIn(d26, WIN26);
    var det25 = detRowsIn(d25, WIN25);

    function customerKey(r) {
      var c = String(r['客户'] === null || r['客户'] === undefined ? '' : r['客户']);
      if (c.indexOf('螺大叔') >= 0 || c.indexOf('春日') >= 0) return '私域';
      return String(r['客户属性'] === null || r['客户属性'] === undefined ? '' : r['客户属性']) || '(未标注)';
    }
    function catKey(r) {
      var v = r['品项类别'];
      return (v === null || v === undefined || v === '') ? '(未标注)' : String(v);
    }
    function salesmanKey(r) {
      var v = r['业务员'];
      return (v === null || v === undefined || v === '') ? '(未填)' : String(v);
    }

    var ch26 = groupSum(det26, customerKey, true);
    var ch25 = groupSum(det25, customerKey, true);
    var ch26Total = sumVals(ch26);
    var chKeys = Object.keys(ch26).concat(Object.keys(ch25).filter(function (k) { return !(k in ch26); }));
    chKeys.sort(function (a, b) { return (ch26[b] || 0) - (ch26[a] || 0) || (a < b ? -1 : (a > b ? 1 : 0)); });
    var channels = chKeys.map(function (name) {
      var v26 = r2(ch26[name] || 0);
      var v25 = r2(ch25[name] || 0);
      return {
        name: name, v26: v26, v25: v25,
        share26: ch26Total ? pyRound(v26 / ch26Total * 100, 2) : 0,
        yoy: v25 ? pct((v26 - v25) / v25) : null
      };
    });

    var priv26 = {}, priv25 = {};
    det26.forEach(function (pair) {
      if (customerKey(pair[1]) === '私域') {
        var k = String(pair[1]['客户'] === null || pair[1]['客户'] === undefined || pair[1]['客户'] === '' ? '?' : pair[1]['客户']);
        priv26[k] = (priv26[k] || 0) + moneyPre(pair[1]);
      }
    });
    det25.forEach(function (pair) {
      if (customerKey(pair[1]) === '私域') {
        var k = String(pair[1]['客户'] === null || pair[1]['客户'] === undefined || pair[1]['客户'] === '' ? '?' : pair[1]['客户']);
        priv25[k] = (priv25[k] || 0) + moneyPre(pair[1]);
      }
    });
    Object.keys(priv26).forEach(function (k) { priv26[k] /= 10000; });
    Object.keys(priv25).forEach(function (k) { priv25[k] /= 10000; });
    var privKeys = Object.keys(priv26).concat(Object.keys(priv25).filter(function (k) { return !(k in priv26); }));
    privKeys.sort(function (a, b) { return (priv26[b] || 0) - (priv26[a] || 0) || (a < b ? -1 : (a > b ? 1 : 0)); });
    var privateRows = privKeys.map(function (name) {
      var v26 = r2(priv26[name] || 0);
      var v25 = r2(priv25[name] || 0);
      return { name: name, v26: v26, v25: v25, yoy: v25 ? pct((v26 - v25) / v25) : null };
    });

    // 月度明细总额（用于 328 占比）
    var m26Tot = {};
    det26.forEach(function (pair) { m26Tot[pair[0][1]] = (m26Tot[pair[0][1]] || 0) + moneyPre(pair[1]); });
    function is328(r) { return String(r['品项类别'] === null || r['品项类别'] === undefined ? '' : r['品项类别']).indexOf('328') >= 0; }

    var p328Months = MONTHS.map(function (m) {
      var amt = 0;
      det26.forEach(function (pair) { if (pair[0][1] === m && is328(pair[1])) amt += moneyPre(pair[1]); });
      var tot = m26Tot[m] || 0;
      return { month: m, amt: pyRound(amt / 10000, 2), share: tot ? pyRound(amt / tot * 100, 2) : 0 };
    });
    var p328Skus = {};
    det26.forEach(function (pair) {
      if (!is328(pair[1])) return;
      var r = pair[1];
      var sku = String(r['品项明细'] === null || r['品项明细'] === undefined || r['品项明细'] === '' ? '?' : r['品项明细']);
      if (!p328Skus[sku]) p328Skus[sku] = [0, 0];
      p328Skus[sku][0] += Math.trunc(fnum(r['实发数量']));
      p328Skus[sku][1] += moneyPre(r);
    });
    var skuRows = Object.keys(p328Skus).map(function (k) {
      return { sku: k, qty: p328Skus[k][0], amt: pyRound(p328Skus[k][1] / 10000, 2) };
    }).sort(function (a, b) { return (p328Skus[b.sku][1] - p328Skus[a.sku][1]) || (a.sku < b.sku ? -1 : (a.sku > b.sku ? 1 : 0)); });

    /* ===== 品项类别：占比 + 同期比趋势 ===== */
    var cat26All = groupSum(det26, catKey, true);
    var cat25All = groupSum(det25, catKey, true);
    var cat26Total = sumVals(cat26All);
    var catKeys = Object.keys(cat26All).concat(Object.keys(cat25All).filter(function (k) { return !(k in cat26All); }));
    catKeys.sort(function (a, b) { return (cat26All[b] || 0) - (cat26All[a] || 0) || (a < b ? -1 : (a > b ? 1 : 0)); });
    var catRowsAll = catKeys.map(function (name) {
      var v26 = r2(cat26All[name] || 0);
      var v25 = r2(cat25All[name] || 0);
      return {
        name: name, v26: v26, v25: v25,
        share26: cat26Total ? pyRound(v26 / cat26Total * 100, 2) : 0,
        yoy: v25 ? pct((v26 - v25) / v25) : null
      };
    });
    var topMain = catRowsAll.slice(0, 10);
    var topNames = {};
    topMain.forEach(function (c) { topNames[c.name] = true; });
    var rest = catRowsAll.filter(function (c) { return !topNames[c.name]; });
    if (rest.length) {
      var v26r = r2(rest.reduce(function (a, c) { return a + c.v26; }, 0));
      var v25r = r2(rest.reduce(function (a, c) { return a + c.v25; }, 0));
      topMain.push({
        name: '其他品项合计', v26: v26r, v25: v25r,
        share26: cat26Total ? pyRound(v26r / cat26Total * 100, 2) : 0,
        yoy: v25r ? pct((v26r - v25r) / v25r) : null, other: true
      });
    }

    function monthlyCat(cat) {
      var m26 = {}, m25 = {};
      det26.forEach(function (p) { if (catKey(p[1]) === cat) m26[p[0][1]] = (m26[p[0][1]] || 0) + moneyPre(p[1]); });
      det25.forEach(function (p) { if (catKey(p[1]) === cat) m25[p[0][1]] = (m25[p[0][1]] || 0) + moneyPre(p[1]); });
      return MONTHS.map(function (m) {
        var a = r2((m26[m] || 0) / 10000);
        var b = r2((m25[m] || 0) / 10000);
        return { month: m, v26: a, v25: b, yoy: b ? pct((a - b) / b) : null };
      });
    }
    var trendCands = topMain.filter(function (c) { return !c.other && (c.v25 || 0) > 0; });
    trendCands.sort(function (a, b) { return (b.v26 + (b.v25 || 0)) - (a.v26 + (a.v25 || 0)); });
    var products = {
      rows: topMain,
      trend: trendCands.slice(0, 6).map(function (c) { return { name: c.name, months: monthlyCat(c.name) }; })
    };

    /* ===== 客户同比（3-8月，折前） ===== */
    var cust26 = {}, cust25 = {};
    det26.forEach(function (p) {
      var c = String(p[1]['客户'] === null || p[1]['客户'] === undefined || p[1]['客户'] === '' ? '?' : p[1]['客户']);
      cust26[c] = (cust26[c] || 0) + moneyPre(p[1]);
    });
    det25.forEach(function (p) {
      var c = String(p[1]['客户'] === null || p[1]['客户'] === undefined || p[1]['客户'] === '' ? '?' : p[1]['客户']);
      cust25[c] = (cust25[c] || 0) + moneyPre(p[1]);
    });
    var custKeys = Object.keys(cust25).concat(Object.keys(cust26).filter(function (k) { return !(k in cust25); }));
    var custRows = [];
    custKeys.forEach(function (c) {
      var v25 = (cust25[c] || 0) / 10000;
      var v26 = (cust26[c] || 0) / 10000;
      if (Math.max(v25, v26) < 1) return;
      custRows.push({
        name: c, v25: r2(v25), v26: r2(v26),
        yoy: v25 ? pct((v26 - v25) / v25) : null,
        loss: r2(v25 - v26)
      });
    });
    var decliners = custRows.filter(function (x) { return x.v25 >= 3 && x.v26 < x.v25; });
    decliners.sort(function (a, b) { return b.loss - a.loss || (a.name < b.name ? -1 : (a.name > b.name ? 1 : 0)); });
    var gainers = custRows.filter(function (x) { return x.v26 >= x.v25 && x.v26 >= 3; });
    gainers.sort(function (a, b) { return (b.v26 - b.v25) - (a.v26 - a.v25) || (a.name < b.name ? -1 : (a.name > b.name ? 1 : 0)); });

    /* ===== 客户销售排行（26年3-8月，按业务员可切片） ===== */
    var salesmanTot = groupSum(det26, salesmanKey, true);
    var custSalesman = {};
    var tmpCs = {};
    det26.forEach(function (p) {
      var c = String(p[1]['客户'] === null || p[1]['客户'] === undefined || p[1]['客户'] === '' ? '?' : p[1]['客户']);
      if (!tmpCs[c]) tmpCs[c] = {};
      var sm = salesmanKey(p[1]);
      tmpCs[c][sm] = (tmpCs[c][sm] || 0) + moneyPre(p[1]);
    });
    Object.keys(tmpCs).forEach(function (c) {
      var best = null;
      Object.keys(tmpCs[c]).forEach(function (k) { if (best === null || tmpCs[c][k] > tmpCs[c][best]) best = k; });
      custSalesman[c] = best;
    });
    var custSort = Object.keys(cust26).sort(function (a, b) { return cust26[b] - cust26[a] || (a < b ? -1 : (a > b ? 1 : 0)); });
    var custRankRows = custSort.map(function (c) {
      return { name: c, v26: r2(cust26[c] / 10000), salesman: custSalesman[c] || '(未填)' };
    });

    function custMonthlyDetail(name) {
      var m26 = {}, m25 = {};
      det26.forEach(function (p) { if (String(p[1]['客户'] || '') === name) m26[p[0][1]] = (m26[p[0][1]] || 0) + moneyPre(p[1]); });
      det25.forEach(function (p) { if (String(p[1]['客户'] || '') === name) m25[p[0][1]] = (m25[p[0][1]] || 0) + moneyPre(p[1]); });
      return MONTHS.map(function (m) {
        var a = r2((m26[m] || 0) / 10000);
        var b = r2((m25[m] || 0) / 10000);
        return { month: m, v26: a, v25: b, yoy: b ? pct((a - b) / b) : null };
      });
    }
    var total26Detail = sumVals(cust26) / 10000;
    var custMonthlyTop = custRankRows.slice(0, 10).map(function (cr, i) {
      var name = cr.name;
      var v25 = (cust25[name] || 0) / 10000;
      return {
        name: name, rank: i + 1, v26: cr.v26, v25: r2(v25),
        yoy: v25 ? pct((cr.v26 - v25) / v25) : null,
        share26: total26Detail ? pyRound(cr.v26 / total26Detail * 100, 2) : 0,
        salesman: cr.salesman,
        months: custMonthlyDetail(name)
      };
    });

    var managerTrend = [];
    mgrSheets.forEach(function (sheet) {
      var rows = periodRows(sheet.rows, '销售经理', sheet.name, PERIODS);
      var s = summarizeRows(rows);
      if (!s.months.length) return;
      managerTrend.push({ name: sheet.name, months: s.months });
    });

    function jinyuMonth(rows, year, keyword) {
      return MONTHS.map(function (m) {
        var amt = 0;
        detRowsIn(rows, [{ y: year, m: m }]).forEach(function (p) {
          if (String(p[1]['客户'] || '').indexOf(keyword) >= 0) amt += moneyPre(p[1]);
        });
        return pyRound(amt / 10000, 2);
      });
    }
    var KEY_CUST = (opts.keyCustomer || '金羽');
    var keyFull = '', keyFullV = -1;
    Object.keys(cust26).forEach(function (c) {
      if (c.indexOf(KEY_CUST) >= 0 && cust26[c] > keyFullV) { keyFull = c; keyFullV = cust26[c]; }
    });
    var jinyu = {
      months: MONTHS,
      key: KEY_CUST,
      fullName: keyFull,
      y25: jinyuMonth(d25, WIN25[0].y, KEY_CUST),
      y26: jinyuMonth(d26, WIN26[0].y, KEY_CUST)
    };
    var jy26 = jinyu.y26.reduce(function (a, b) { return a + b; }, 0);
    var jy25 = jinyu.y25.reduce(function (a, b) { return a + b; }, 0);
    jinyu.total26 = r2(jy26);
    jinyu.total25 = r2(jy25);
    jinyu.yoy = jy25 ? pct((jy26 - jy25) / jy25) : null;

    var check = {
      guibei_detail_total: pyRound(sumVals(m26Tot) / 10000, 2),
      guibei_summary_cum: gbKpi.out,
      direct_summary_cum: dKpi.out,
      guibei_fy25_detail_total: pyRound(sumVals(groupSum(det25, function () { return 'all'; }, false)) / 10000, 2),
      guibei_q1q2_same_summary: r2(q1.same + q2.same)
    };

    var today = opts.builtAt || new Date().toISOString().slice(0, 10);
    var monthSpan = MONTHS.length ? (MONTHS[0] + '-' + MONTHS[MONTHS.length - 1] + '月') : '';
    var quarterSpan = gbQuarters.length ? ('（' + gbQuarters[0].quarter + '-' + gbQuarters[gbQuarters.length - 1].quarter + '）') : '';
    var fyYear = WIN26.length ? WIN26[0].y : new Date().getFullYear();
    var subtitle = fyYear + '财年 ' + monthSpan + quarterSpan + (opts.subtitleExtra ? '· ' + opts.subtitleExtra : '');

    return {
      meta: {
        title: opts.title || '桂北·直营 季度经营看板',
        subtitle: subtitle,
        builtAt: today,
        source: opts.source || '飞书多维表格导出：客户出库单 ×2、区域/直营/销售经理总业绩 ×3',
        cutoff: latestDate(d26) || latestDate(d25),
        months: MONTHS,
        monthSpan: monthSpan,
        fyLabel: fyYear + '财年' + monthSpan,
        fyYear: fyYear,
        quarterSpans: P.quarters.map(function (q) {
          var ms = q.months.map(function (c) { return parseInt(c.slice(2), 10); });
          return { quarter: q.quarter, label: ms[0] + '-' + ms[ms.length - 1] + '月' };
        }),
        residualName: opts.residualName || '李航'
      },
      guibei: { kpi: gbKpi, months: gbMonths, quarters: gbQuarters },
      direct: { kpi: dKpi, months: dMonths, quarters: dQuarters },
      managers: mgrList,
      channels: channels,
      private: privateRows,
      p328: { months: p328Months, skus: skuRows },
      products: products,
      salesmanTot: (function () {
        var o = {};
        Object.keys(salesmanTot).sort(function (a, b) { return salesmanTot[b] - salesmanTot[a] || (a < b ? -1 : (a > b ? 1 : 0)); })
          .forEach(function (k) { o[k] = r2(salesmanTot[k]); });
        return o;
      })(),
      customerRank: custRankRows,
      custMonthlyTop: custMonthlyTop,
      managerTrend: managerTrend,
      customers: {
        decliners: decliners.slice(0, 12),
        gainers: gainers.slice(0, 6),
        jinyu: jinyu,
        count26: Object.keys(cust26).length,
        count25: Object.keys(cust25).length
      },
      check: check
    };
  }

  return {
    compute: compute,
    loadDetail: loadDetail,
    loadSummary: loadSummary,
    derivePeriods: derivePeriods,
    pyRound: pyRound,
    fnum: fnum
  };
});

(function (global) {

  var MGR_PALETTE = ['#3370ff', '#00b42a', '#ff7d00', '#722ed1', '#14c9c9', '#f77234'];

  /* ---------- 文本小工具 ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fw(v, d) { d = d == null ? 2 : d; if (v == null || isNaN(v)) return '—'; return Number(v).toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function fwt(v, d) { d = d == null ? 2 : d; if (v == null || isNaN(v)) return '—'; return Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: d }); }
  function fw0(v) { return v == null ? '—' : Number(v).toLocaleString('zh-CN', { maximumFractionDigits: 0 }); }
  function pct(v, d) { d = d == null ? 2 : d; if (v == null || isNaN(v)) return '<span class="dim">—</span>'; var s = Math.abs(v).toFixed(d) + '%'; var c = v > 0 ? 'up' : (v < 0 ? 'down' : ''); if (v > 0) s = '+' + s; if (v < 0) s = '-' + s; return '<b class="' + c + '">' + s + '</b>'; }
  function pctPlain(v, d) { d = d == null ? 2 : d; if (v == null || isNaN(v)) return '—'; var s = Math.abs(v).toFixed(d) + '%'; if (v > 0) s = '+' + s; if (v < 0) s = '-' + s; return s; }
  function pctTxt(v, d) { d = d == null ? 2 : d; if (v == null || isNaN(v)) return '—'; return (v > 0 ? '+' : (v < 0 ? '-' : '')) + Math.abs(v).toFixed(d) + '%'; }
  function r2v(x) { return Math.round(x * 100) / 100; }
  function shortName(n) {

    });
    ['有限责任公司', '网络科技有限公司', '商贸有限公司', '食品有限公司', '贸易有限公司', '供应链有限公司',
      '百货商行', '食品经营部', '有限公司', '食品店', '公司', '商行', '食品', '商贸', '贸易', '网络科技'].forEach(function (s) {

      var keep = (k === 'f25' || k === 'f26') ? window.BoardPack.KEEP_COLS : null;
      out.files[k] = { name: f.name, sheets: window.BoardPack.packBook(f.sheets, keep) };
    });
    return out;
  }
  function unpackState(p) {
    var files = {};
    ORDER.forEach(function (k) {
      var f = p.files && p.files[k];
      if (!f) return;
      files[k] = { name: f.name, sheets: window.BoardPack.unpackBook(f.sheets) };
    });
    return { source: p.source || 'upload', savedAt: p.savedAt || null, files: files };
  }

  /* ================= 识别上传的表 ================= */
  function hdrOf(rows) { return ((rows && rows[0]) || []).map(function (x) { return x == null ? '' : String(x).trim(); }); }

  function detectYear(rows) {
    var idx = hdrOf(rows).indexOf('日期');
    if (idx < 0) return null;
    var cnt = {};
    for (var i = 1; i < rows.length; i++) {
      var m = /(\d{4})[/-]\d{1,2}[/-]\d{1,2}/.exec(String((rows[i] || [])[idx] || ''));
      if (m) cnt[m[1]] = (cnt[m[1]] || 0) + 1;
    }
    var best = null;
    Object.keys(cnt).forEach(function (y) { if (!best || cnt[y] > cnt[best]) best = y; });
    return best ? parseInt(best, 10) : null;
  }

  function detectKind(wb, fileName) {
    var sheet = wb.sheets[0];
    if (!sheet) return null;
    var hdr = hdrOf(sheet.rows), set = {};
    hdr.forEach(function (h) { set[h] = true; });
    if (set['单据编号'] && (set['价税合计（折前）'] || set['价税合计'])) {
      return { kind: 'detail', key: null, year: detectYear(sheet.rows) };
    }
    if (hdr[0] === '销售经理' || /销售经理/.test(fileName)) return { kind: 'mgr', key: 'mgr' };
    if (hdr[0] === '战区' || hdr[0] === '区域') {
      var isDirect = /直营/.test(fileName) || /直营/.test(sheet.name);
      if (!isDirect) {
        for (var i = 1; i < Math.min(sheet.rows.length, 8); i++) {
          var v = String((sheet.rows[i] || [])[0] || '');
          if (v === '直营区域') { isDirect = true; break; }
        }
      }
      return { kind: 'summary', key: isDirect ? 'direct' : 'region' };
    }
    return null;
  }

  /* ================= 计算 & 渲染 ================= */
  function computeNow() {
    var input = {
      f25: state.files.f25, f26: state.files.f26, region: state.files.region,
      direct: state.files.direct, mgr: state.files.mgr
    };
    ORDER.forEach(function (k) { if (!input[k]) throw new Error('缺少数据表：' + FILES[k].label); });
    var D = window.BoardCompute.compute(input, {
      builtAt: state.savedAt ? String(state.savedAt).slice(0, 10) : ymd(),
      subtitleExtra: '季度会演示版'
    });
    D.meta.sourceKind = state.source;
    D.meta.savedAt = state.savedAt;
    return D;
  }

  function sheetRowsCount(f) { return f && f.sheets && f.sheets[0] ? Math.max(0, f.sheets[0].rows.length - 1) : 0; }

  function bindDrawer() {
    var dz = $('#dropZone');
    dz.addEventListener('click', function () { pickFiles(null, null); });
    dz.addEventListener('dragover', function (e) { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', function () { dz.classList.remove('over'); });
    dz.addEventListener('drop', function (e) {
      e.preventDefault(); dz.classList.remove('over');

    });
    $('#btnPick').addEventListener('click', function () { pickFiles(null, null); });
    $('#btnClearAll').addEventListener('click', function () {
      if (!confirm('清空本机缓存？将回到内置数据（导出的数据包不受影响）。')) return;

    $('#packPick').addEventListener('change', function (e) {

  function pickFiles(inputEl, onlyKey) {
    var input = inputEl || $('#filePick');
    pendingOnlyKey = onlyKey || null;
    input.value = '';
    input.click();
  }
  var pendingOnlyKey = null;

  function handleFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    var onlyKey = pendingOnlyKey;
    pendingOnlyKey = null;
    if (onlyKey && files.length > 1) files = files.slice(0, 1);
    var pending = files.map(function (f) { return { file: f, name: f.name }; });
    toast('正在读取 ' + files.length + ' 个文件…', 6000);
    var jobs = pending.map(function (p) {
      return p.file.arrayBuffer().then(function (buf) { return window.XlsxLite.read(buf); })
        .then(function (wb) { p.wb = wb; return p; });
    });
    Promise.all(jobs).then(function (list) {
      applyUploaded(list, onlyKey);
    }).catch(function (err) {
      toast('读取失败：' + (err && err.message ? err.message : err), 6000);
    });
  }

  function applyUploaded(list, onlyKey) {
    var msgs = [], missed = [];
    var staged = {};
    // 先处理汇总表（用来判断哪份明细是"本期"）
    var summaries = [], details = [], mgrs = [];
    list.forEach(function (p) {
      var kind;
      try { kind = detectKind(p.wb, p.name); } catch (e) { kind = null; }
      if (!kind) { missed.push(p.name); return; }
      p.kind = kind;
      if (kind.kind === 'detail') details.push(p);
      else if (kind.kind === 'mgr') mgrs.push(p);
      else summaries.push(p);
    });
    var newRegion = summaries.filter(function (p) { return p.kind.key === 'region'; })[0];
    var fyYear = state.data ? state.data.meta.fyYear : null;
    if (newRegion) {
      var rs = window.BoardCompute.loadSummary(newRegion.wb.sheets[0].rows);
      var per = window.BoardCompute.derivePeriods(rs);
      if (per.win.length) fyYear = per.win[0].y;
    }
    summaries.forEach(function (p) {
      staged[p.kind.key] = { name: p.name, sheets: p.wb.sheets };
      msgs.push(FILES[p.kind.key].label + ' ← ' + p.name);
    });
    mgrs.forEach(function (p) {
      var sheets = p.wb.sheets.map(function (s) {
        var nm = s.name;
        if (/^sheet\d*$/i.test(nm)) {
          var idx = hdrOf(s.rows).indexOf('销售经理');
          var v = idx >= 0 && s.rows[1] ? s.rows[1][idx] : null;
          if (v) nm = String(v).trim();
        }
        return { name: nm, rows: s.rows };
      });
      staged.mgr = { name: p.name, sheets: sheets };
      msgs.push(FILES.mgr.label + ' ← ' + p.name + '（' + sheets.map(function (s) { return s.name; }).join('/') + '）');
    });
    details.forEach(function (p) {
      var key;
      if (fyYear && p.kind.year) key = (p.kind.year === fyYear) ? 'f26' : 'f25';
      else if (/2025/.test(p.name)) key = 'f25';
      else if (/2026/.test(p.name)) key = 'f26';
      else key = 'f26';
      if (onlyKey && (key === 'f25' || key === 'f26')) key = onlyKey;
      staged[key] = { name: p.name, sheets: p.wb.sheets };
      msgs.push(FILES[key].label + ' ← ' + p.name + '（数据年份 ' + (p.kind.year || '?') + '）');
    });
    if (onlyKey && !staged[onlyKey]) {
      var first = list[0];
      if (first) { staged[onlyKey] = { name: first.name, sheets: first.wb.sheets }; msgs.push(FILES[onlyKey].label + ' ← ' + first.name + '（按指定槽位导入）'); }
    }
    if (!msgs.length) { toast('没识别出可用的表：' + missed.join('、') + '。请确认导出的是原始 xlsx（不要另存成 csv）。', 7000); return; }
    ORDER.forEach(function (k) { if (staged[k]) state.files[k] = staged[k]; });
    state.source = 'upload';
    state.savedAt = new Date().toISOString();

    try {
      refreshAll();
    } catch (err) {
      toast('重算失败：' + err.message + '（数据未保存，请检查是否传错表）', 8000);
      return;
    }
    persist().then(function () { renderDrawer(); });
    var chk = state.data.check;
    var okTxt = Math.abs(chk.guibei_detail_total - chk.guibei_summary_cum) < 0.02 ? '核对一致' : '⚠ 明细与区域表差 ' + fw(chk.guibei_detail_total - chk.guibei_summary_cum) + ' 万';
    toast('已更新 ' + msgs.length + ' 张表，看板已重算（' + okTxt + '）', 5000);
    if (missed.length) toast('以下文件未识别：' + missed.join('、'), 6000);
  }

  function persist() { return store.set(packState()); }

  /* ================= 发布版导出 ================= */
  function buildPublishHtml() {
    var clone = document.documentElement.cloneNode(true);
    ['boardRoot', 'analysisRoot', 'detailRoot'].forEach(function (id) {
      var el = clone.querySelector('#' + id); if (el) el.innerHTML = '';
    });
    var dr = clone.querySelector('#drawer'); if (dr) { dr.hidden = true; dr.querySelector('#drawerBody').innerHTML = ''; }
    var mk = clone.querySelector('#drawerMask'); if (mk) mk.hidden = true;
    var st = clone.querySelector('#dataStatusTxt'); if (st) st.textContent = '';
    var script = clone.querySelector('#defaultDataScript');
    script.textContent = 'window.__BOARD_PACK__ = ' + JSON.stringify(packState()) + ';';
    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  /* ================= 页签 ================= */
  function switchTab(tab) {
    $$('.app-tabs button').forEach(function (b) { b.className = b.getAttribute('data-tab') === tab ? 'on' : ''; });
    $('#boardRoot').hidden = tab !== 'board';
    $('#analysisRoot').hidden = tab !== 'analysis';
    $('#detailRoot').hidden = tab !== 'detail';
    if (tab === 'analysis') buildAnalysisShell();
    if (tab === 'detail') renderDetail();
    window.scrollTo(0, 0);
  }

  /* ================= 数据视图（分析/明细共用） ================= */
  function rowsOf(which) {
    var f = which === 'cur' ? state.files.f26 : state.files.f25;
    return f && f.sheets[0] ? f.sheets[0].rows : [];
  }
  function objectsOf(which) {
    if (!state.rowCache) state.rowCache = {};
    if (state.rowCache[which]) return state.rowCache[which];
    var rows = rowsOf(which);
    var hdr = hdrOf(rows);
    var out = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      if (!r) continue;
      var o = {};
      hdr.forEach(function (h, ci) { o[h] = r[ci] === undefined ? null : r[ci]; });
      if (hdr.indexOf('单据编号') >= 0 && (o['单据编号'] === null || o['单据编号'] === '')) continue;
      out.push(o);
    }
    state.rowCache[which] = out;
    return out;
  }
  function monthOf(r) {
    var m = /(\d{4})[/-](\d{1,2})[/-]\d{1,2}/.exec(String(r['日期'] || ''));
    return m ? parseInt(m[2], 10) : null;
  }
  function str(v) { return v == null ? '' : String(v); }
  var DIMS = {
    '客户属性': function (r) { return str(r['客户属性']) || '(未标注)'; },
    '客户': function (r) { return str(r['客户']) || '?'; },
    '业务员': function (r) { return str(r['业务员']) || '(未填)'; },
    '片区': function (r) { return str(r['片区']) || '(未填)'; },
    '销售部门': function (r) { return str(r['销售部门']) || '(未填)'; },
    '品项类别': function (r) { return str(r['品项类别']) || '(未标注)'; },
    '品项明细': function (r) { return str(r['品项明细']) || '(未标注)'; },
    '月份': function (r) { var m = monthOf(r); return m == null ? '(无日期)' : m + '月'; }
  };
  var MEAS = {
    amt: { label: '折前金额（万）', sum: function (r) { return fnum(r['价税合计（折前）']) / 10000; }, dec: 2, unit: '万' },
    amtRaw: { label: '价税合计（万）', sum: function (r) { return fnum(r['价税合计']) / 10000; }, dec: 2, unit: '万' },
    qty: { label: '实发数量', sum: function (r) { return fnum(r['实发数量']); }, dec: 0, unit: '' },
    orders: { label: '单据数', distinct: function (r) { return str(r['单据编号']); }, dec: 0, unit: '张' },
    custs: { label: '客户数', distinct: function (r) { return str(r['客户']); }, dec: 0, unit: '家' },
    price: { label: '均价（元/件）', price: true, dec: 2, unit: '' }
  };

  function dimValues(list, dim) {
    var fn = DIMS[dim], s = {};
    list.forEach(function (r) { var v = fn(r); s[v] = (s[v] || 0) + 1; });
    return Object.keys(s).sort(function (a, b) { return s[b] - s[a] || (a < b ? -1 : 1); });
  }

  function filterList(list) {
    return list.filter(function (r) {
      if (F.months.length) { var m = monthOf(r); if (m == null || F.months.indexOf(m) < 0) return false; }
      if (F.attrs.length && F.attrs.indexOf(DIMS['客户属性'](r)) < 0) return false;
      if (F.salesmen.length && F.salesmen.indexOf(DIMS['业务员'](r)) < 0) return false;
      if (F.cats.length && F.cats.indexOf(DIMS['品项类别'](r)) < 0) return false;
      if (F.kw) {
        var k = F.kw.toLowerCase();
        if ((str(r['客户']) + ' ' + str(r['品项明细']) + ' ' + str(r['客户属性'])).toLowerCase().indexOf(k) < 0) return false;
      }
      return true;
    });
  }

  function measureOf(list, key) {
    var M2 = MEAS[key];
    if (M2.price) {
      var amt = 0, qty = 0;
      list.forEach(function (r) { amt += fnum(r['价税合计（折前）']); qty += fnum(r['实发数量']); });
      return qty ? amt / qty : 0;
    }
    if (M2.distinct) {
      var set = {};
      list.forEach(function (r) { var v = M2.distinct(r); if (v) set[v] = 1; });
      return Object.keys(set).length;
    }
    var s = 0;
    list.forEach(function (r) { s += M2.sum(r); });
    return window.BoardCompute.pyRound(s, M2.dec);
  }

  function buildPivot(cur, prev) {
    var rowFn = DIMS[F.rowDim];
    var groups = {};
    cur.forEach(function (r) { var k = rowFn(r); (groups[k] = groups[k] || []).push(r); });
    var colDim = F.colDim && F.colDim !== '无' ? F.colDim : null;
    var colFn = colDim ? DIMS[colDim] : null;
    var colKeys = colDim ? dimValues(cur, colDim) : [];
    var rows = Object.keys(groups).map(function (k) {
      var list = groups[k];
      var cells = {};
      if (colDim) {
        colKeys.forEach(function (ck) { cells[ck] = measureOf(list.filter(function (r) { return colFn(r) === ck; }), F.measure); });
      }
      return { key: k, list: list, total: measureOf(list, F.measure), cells: cells };
    });
    rows.sort(function (a, b) { return b.total - a.total || (a.key < b.key ? -1 : 1); });
    var totalAll = measureOf(cur, F.measure);
    var totalCols = {};
    colKeys.forEach(function (ck) { totalCols[ck] = measureOf(cur.filter(function (r) { return colFn(r) === ck; }), F.measure); });
    // 同比
    var prevMap = {}, prevTotal = null;
    if (prev) {
      var pg = {};
      prev.forEach(function (r) { var k = rowFn(r); (pg[k] = pg[k] || []).push(r); });
      Object.keys(pg).forEach(function (k) { prevMap[k] = measureOf(pg[k], F.measure); });
      prevTotal = measureOf(prev, F.measure);
    }
    return { rows: rows, colKeys: colKeys, totalAll: totalAll, totalCols: totalCols, prevMap: prevMap, prevTotal: prevTotal };
  }

  function yoyOf(curV, prevV) {
    if (prevV == null) return null;
    if (!prevV) return null;
    return Math.round((curV - prevV) / prevV * 10000) / 100;
  }
  function pctHtml(v) {
    if (v == null) return '<span class="dim">—</span>';
    var c = v > 0 ? 'up' : (v < 0 ? 'down' : '');
    return '<b class="' + c + '">' + (v > 0 ? '+' : '') + v.toFixed(2) + '%</b>';
  }

  /* ================= 自助分析 ================= */
  function buildAnalysisShell(force) {
    var root = $('#analysisRoot');
    if (root.dataset.built && !force) { updateAnalysis(); return; }
    var attrs = dimValues(objectsOf('cur'), '客户属性');
    var sales = dimValues(objectsOf('cur'), '业务员');
    var cats = dimValues(objectsOf('cur'), '品项类别');
    var months = {};
    objectsOf('cur').forEach(function (r) { var m = monthOf(r); if (m) months[m] = 1; });
    var monthList = Object.keys(months).map(Number).sort(function (a, b) { return a - b; });
    F.months = F.months.filter(function (m) { return monthList.indexOf(m) >= 0; });
    var D = state.data;
    var h = '<div class="wrap">';
    h += '<div class="filters">';
    h += '<div class="frow"><div class="fgroup"><label>数据期间</label>' +
      '<button class="pill' + (F.year === 'cur' ? ' on' : '') + '" data-y="cur">' + D.meta.fyLabel + '（本期）</button>' +
      '<button class="pill' + (F.year === 'prev' ? ' on' : '') + '" data-y="prev">上年同期</button></div>' +
      '<div class="fgroup"><label>月份</label><button class="pill' + (F.months.length ? '' : ' on') + '" data-mo="all">全部</button>' +
      monthList.map(function (m) { return '<button class="pill' + (F.months.indexOf(m) >= 0 ? ' on' : '') + '" data-mo="' + m + '">' + m + '月</button>'; }).join('') +
      '</div></div>';
    h += '<div class="frow"><div class="fgroup"><label>客户属性</label><button class="pill' + (F.attrs.length ? '' : ' on') + '" data-at="all">全部</button>' +
      attrs.map(function (a) { return '<button class="pill' + (F.attrs.indexOf(a) >= 0 ? ' on' : '') + '" data-at="' + esc(a) + '">' + esc(a) + '</button>'; }).join('') + '</div></div>';
    h += '<div class="frow"><div class="fgroup"><label>业务员</label><button class="pill' + (F.salesmen.length ? '' : ' on') + '" data-sm="all">全部</button>' +
      sales.map(function (a) { return '<button class="pill' + (F.salesmen.indexOf(a) >= 0 ? ' on' : '') + '" data-sm="' + esc(a) + '">' + esc(a) + '</button>'; }).join('') + '</div></div>';
    h += '<div class="frow"><div class="fgroup"><label>品项类别</label><button class="pill' + (F.cats.length ? '' : ' on') + '" data-ca="all">全部</button>' +
      cats.slice(0, 14).map(function (a) { return '<button class="pill' + (F.cats.indexOf(a) >= 0 ? ' on' : '') + '" data-ca="' + esc(a) + '">' + esc(a) + '</button>'; }).join('') +
      (cats.length > 14 ? '<span style="font-size:12px;color:var(--sub)">…共 ' + cats.length + ' 类</span>' : '') + '</div></div>';
    h += '<div class="frow"><div class="fgroup"><label>关键词</label><input type="text" id="fKw" placeholder="客户 / 品项名称，回车筛选" value="' + esc(F.kw) + '"></div>';
    h += '<div class="fgroup" style="margin-left:auto"><label>快速视图</label><span class="presets">' +
      '<button class="pill" data-preset="cust">客户排行</button>' +
      '<button class="pill" data-preset="attr">渠道结构</button>' +
      '<button class="pill" data-preset="cat">品项结构</button>' +
      '<button class="pill" data-preset="sales">业务员业绩</button>' +
      '<button class="pill" data-preset="month">月度趋势</button>' +
      '</span></div></div>';
    h += '<div class="frow"><div class="fgroup"><label>行维度</label><select id="fRow">' +
      Object.keys(DIMS).map(function (k) { return '<option' + (k === F.rowDim ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></div>' +
      '<div class="fgroup"><label>列维度</label><select id="fCol"><option' + (F.colDim === '无' ? ' selected' : '') + '>无</option>' +
      ['月份', '客户属性', '品项类别', '业务员', '片区'].map(function (k) { return '<option' + (k === F.colDim ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></div>' +
      '<div class="fgroup"><label>指标</label><select id="fMea">' +
      Object.keys(MEAS).map(function (k) { return '<option value="' + k + '"' + (k === F.measure ? ' selected' : '') + '>' + MEAS[k].label + '</option>'; }).join('') + '</select></div>' +
      '<div class="fgroup"><label>显示行数</label><select id="fTop">' +
      [10, 20, 30, 50, 100].map(function (n) { return '<option' + (n === F.topN ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div>' +
      '<div class="fgroup"><button class="act gray" id="fReset">重置筛选</button></div></div>';
    h += '</div>';
    h += '<div id="anaKpi" class="kpis2"></div>';
    h += '<div class="card"><h2 id="anaTitle">分析结果</h2><div class="desc" id="anaDesc"></div>' +
      '<div class="export"><button class="act ghost" id="anaCsv">导出当前结果 CSV</button><span style="font-size:12px;color:var(--sub)">导出的 CSV 可用 Excel 直接打开（已加 UTF-8 头，不乱码）</span></div>' +
      '<div id="anaPivot"></div><div id="anaBars"></div></div>';
    h += '<div class="card"><h2>明细抽样</h2><div class="desc">上面结果里前几笔原始记录（最多 200 行），用于核对。</div><div id="anaSample"></div></div>';
    h += '</div>';
    root.innerHTML = h;
    root.dataset.built = '1';

    $$('.filters .pill[data-y]', root).forEach(function (b) {
      b.addEventListener('click', function () { F.year = b.getAttribute('data-y'); buildAnalysisShell(true); });
    });
    $$('.filters .pill[data-mo]', root).forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-mo');
        if (v === 'all') F.months = [];
        else {
          var m = Number(v);
          var i = F.months.indexOf(m);
          if (i >= 0) F.months.splice(i, 1); else F.months.push(m);
          F.months.sort(function (a, b2) { return a - b2; });
        }
        buildAnalysisShell(true);
      });
    });
    [['at', 'attrs'], ['sm', 'salesmen'], ['ca', 'cats']].forEach(function (pair) {
      $$('.filters .pill[data-' + pair[0] + ']', root).forEach(function (b) {
        b.addEventListener('click', function () {
          var v = b.getAttribute('data-' + pair[0]);
          var arr = F[pair[1]];
          if (v === 'all') F[pair[1]] = [];
          else {
            var i = arr.indexOf(v);
            if (i >= 0) arr.splice(i, 1); else arr.push(v);
          }
          buildAnalysisShell(true);
        });
      });
    });
    var kw = $('#fKw', root);
    kw.addEventListener('keydown', function (e) { if (e.key === 'Enter') { F.kw = kw.value.trim(); buildAnalysisShell(true); } });
    kw.addEventListener('blur', function () { if (kw.value.trim() !== F.kw) { F.kw = kw.value.trim(); buildAnalysisShell(true); } });
    $('#fRow', root).addEventListener('change', function () { F.rowDim = this.value; updateAnalysis(); });
    $('#fCol', root).addEventListener('change', function () { F.colDim = this.value; updateAnalysis(); });
    $('#fMea', root).addEventListener('change', function () { F.measure = this.value; updateAnalysis(); });
    $('#fTop', root).addEventListener('change', function () { F.topN = Number(this.value); updateAnalysis(); });
    $('#fReset', root).addEventListener('click', function () {
      F.months = []; F.attrs = []; F.salesmen = []; F.cats = []; F.kw = '';
      F.rowDim = '客户'; F.colDim = '无'; F.measure = 'amt'; F.topN = 20;
      buildAnalysisShell(true);
    });
    $$('[data-preset]', root).forEach(function (b) {
      b.addEventListener('click', function () {
        var p = b.getAttribute('data-preset');
        if (p === 'cust') { F.rowDim = '客户'; F.colDim = '无'; F.measure = 'amt'; F.topN = 20; }
        if (p === 'attr') { F.rowDim = '客户属性'; F.colDim = '月份'; F.measure = 'amt'; F.topN = 10; }
        if (p === 'cat') { F.rowDim = '品项类别'; F.colDim = '无'; F.measure = 'amt'; F.topN = 20; }
        if (p === 'sales') { F.rowDim = '业务员'; F.colDim = '月份'; F.measure = 'amt'; F.topN = 20; }
        if (p === 'month') { F.rowDim = '月份'; F.colDim = '客户属性'; F.measure = 'amt'; F.topN = 12; }
        buildAnalysisShell(true);
      });
    });
    $('#anaCsv', root).addEventListener('click', function () { exportAnalysisCsv(); });
    updateAnalysis();
  }

  var lastPivot = null;

  function updateAnalysis() {
    var curAll = filterList(objectsOf(F.year === 'cur' ? 'cur' : 'prev'));
    var prevAll = null;
    if (F.year === 'cur') {
      var prevSrc = objectsOf('prev');
      if (prevSrc.length) prevAll = filterList(prevSrc);
    }
    var pv = buildPivot(curAll, prevAll);
    lastPivot = { pivot: pv, list: curAll, prev: prevAll };
    var M2 = MEAS[F.measure];
    var dec = M2.dec;
    var totalTxt = M2.price ? fw(pv.totalAll, dec) : fw(pv.totalAll, dec);

    var pk = '';
    pk += '<div class="k2"><div class="lb">' + esc(M2.label) + ' 合计</div><div class="vl">' + totalTxt + '<small>' + (M2.unit || '') + '</small></div>' +
      '<div class="sb">记录 ' + fwi(curAll.length) + ' 行</div></div>';
    var custSet = {}, skuSet = {}, orderSet = {};
    curAll.forEach(function (r) {
      if (r['客户']) custSet[r['客户']] = 1;
      if (r['品项明细']) skuSet[r['品项明细']] = 1;
      if (r['单据编号']) orderSet[r['单据编号']] = 1;
    });
    pk += '<div class="k2"><div class="lb">客户数</div><div class="vl">' + fwi(Object.keys(custSet).length) + '<small>家</small></div></div>';
    pk += '<div class="k2"><div class="lb">品项数</div><div class="vl">' + fwi(Object.keys(skuSet).length) + '<small>个</small></div></div>';
    pk += '<div class="k2"><div class="lb">单据数</div><div class="vl">' + fwi(Object.keys(orderSet).length) + '<small>张</small></div></div>';
    if (pv.prevTotal != null && !MEAS[F.measure].distinct) {
      var y = yoyOf(pv.totalAll, pv.prevTotal);
      pk += '<div class="k2"><div class="lb">同比（上年同期同口径）</div><div class="vl">' + (y == null ? '—' : (y > 0 ? '+' : '') + y.toFixed(2) + '%') + '</div>' +
        '<div class="sb">上年同期 ' + fw(pv.prevTotal, dec) + '</div></div>';
    }
    $('#anaKpi').innerHTML = pk;

    var rangeTxt = (F.year === 'cur' ? state.data.meta.fyLabel : '上年同期') +
      (F.months.length ? ' · ' + F.months.join('/') + '月' : '') +
      (F.attrs.length ? ' · ' + F.attrs.join('/') : '') +
      (F.salesmen.length ? ' · ' + F.salesmen.join('/') : '') +
      (F.cats.length ? ' · ' + F.cats.slice(0, 3).join('/') + (F.cats.length > 3 ? ' 等' : '') : '') +
      (F.kw ? ' · 关键词“' + F.kw + '”' : '');
    $('#anaTitle').textContent = F.rowDim + ' × ' + (F.colDim === '无' ? '合计' : F.colDim) + ' · ' + M2.label;
    $('#anaDesc').textContent = '当前范围：' + rangeTxt + '。按' + M2.label + '降序，列维度为“' + (F.colDim === '无' ? '无（只看合计）' : F.colDim) + '”。';

    var use = pv.rows.slice(0, F.topN);
    var showYoy = pv.prevTotal != null && !MEAS[F.measure].distinct;
    var headers = [F.rowDim];
    if (pv.colKeys.length) pv.colKeys.forEach(function (c) { headers.push(c); });
    headers.push('合计');
    if (showYoy) { headers.push('上年同期'); headers.push('同比'); }
    headers.push('占比');
    var body = use.map(function (r) {
      var tds = ['<td>' + esc(r.key) + '</td>'];
      if (pv.colKeys.length) pv.colKeys.forEach(function (c) { tds.push('<td>' + fw(r.cells[c], dec) + '</td>'); });
      tds.push('<td><b>' + fw(r.total, dec) + '</b></td>');
      if (showYoy) {
        var pw = pv.prevMap[r.key] == null ? null : pv.prevMap[r.key];
        tds.push('<td>' + (pw == null ? '<span class="dim">—</span>' : fw(pw, dec)) + '</td>');
        tds.push('<td>' + pctHtml(yoyOf(r.total, pw)) + '</td>');
      }
      tds.push('<td>' + (pv.totalAll ? fw(r.total / pv.totalAll * 100, 2) : '0.00') + '%</td>');
      return tds.join('');
    });
    var sumTds = ['<td>合计</td>'];
    if (pv.colKeys.length) pv.colKeys.forEach(function (c) { sumTds.push('<td>' + fw(pv.totalCols[c], dec) + '</td>'); });
    sumTds.push('<td>' + fw(pv.totalAll, dec) + '</td>');
    if (showYoy) { sumTds.push('<td>' + fw(pv.prevTotal, dec) + '</td>'); sumTds.push('<td>' + pctHtml(yoyOf(pv.totalAll, pv.prevTotal)) + '</td>'); }
    sumTds.push('<td>100.00%</td>');
    $('#anaPivot').innerHTML = '<div class="tbl-wrap"><table class="tbl"><tr>' + headers.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') + '</tr>' +
      body.map(function (b) { return '<tr>' + b + '</tr>'; }).join('') +
      '<tr class="sum">' + sumTds.join('') + '</tr></table></div>' +
      (pv.rows.length > use.length ? '<div class="note">共 ' + pv.rows.length + ' 个“' + esc(F.rowDim) + '”取值，当前显示前 ' + use.length + ' 个（可在上方“显示行数”调整）。</div>' : '');

    var maxV = use.length ? Math.max.apply(null, use.map(function (r) { return Math.abs(r.total); })) : 0;
    $('#anaBars').innerHTML = '<div style="font-weight:700;font-size:13.5px;margin:14px 0 6px">TOP ' + use.length + ' 排行</div>' +
      use.map(function (r, i) {
        var no = i === 0 ? 't' : (i === 1 ? 't2' : (i === 2 ? 't3' : ''));
        var w = maxV ? Math.max(1, Math.abs(r.total) / maxV * 100) : 0;
        return '<div class="rank-row"><span class="rank-no ' + no + '">' + (i + 1) + '</span>' +
          '<span class="rank-name" title="' + esc(r.key) + '">' + esc(r.key) + '</span>' +
          '<span class="rank-track"><div style="width:' + w + '%"></div></span>' +
          '<span class="rank-val"><b>' + fw(r.total, dec) + '</b> ' + esc(M2.unit || '') +
          (showYoy && pv.prevMap[r.key] != null ? ' · ' + pctTxt(yoyOf(r.total, pv.prevMap[r.key])) : '') + '</span></div>';
      }).join('');

    var sampleCols = ['日期', '单据编号', '客户', '业务员', '品项类别', '品项明细', '实发数量', '价税合计（折前）', '客户属性'];
    var srows = curAll.slice(0, 200);
    var sHtml = '<div class="tbl-wrap"><table class="tbl"><tr>' + sampleCols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>';
    srows.forEach(function (r) {
      sHtml += '<tr>' + sampleCols.map(function (c) {
        var v = r[c];
        if (c === '价税合计（折前）') return '<td>' + fw(v) + '</td>';
        if (c === '实发数量') return '<td>' + fwi(v) + '</td>';
        return '<td>' + esc(v == null ? '' : v) + '</td>';
      }).join('') + '</tr>';
    });
    sHtml += '</table></div>';
    if (curAll.length > 200) sHtml += '<div class="note">共 ' + fwi(curAll.length) + ' 行，此处抽样前 200 行；需要全部请用上方“导出当前结果 CSV”。</div>';
    if (!curAll.length) sHtml = '<div class="note">当前筛选条件下没有数据。</div>';
    $('#anaSample').innerHTML = sHtml;
  }

  function exportAnalysisCsv() {
    if (!lastPivot) return;
    if (F.selectedExport === 'sample') return;
    var pv = lastPivot.pivot;
    var use = pv.rows.slice(0, F.topN);
    var showYoy = pv.prevTotal != null && !MEAS[F.measure].distinct;
    var rows = [[F.rowDim].concat(pv.colKeys, ['合计']).concat(showYoy ? ['上年同期', '同比%'] : []).concat(['占比%'])];
    use.forEach(function (r) {
      var line = [r.key];
      pv.colKeys.forEach(function (c) { line.push(r.cells[c]); });
      line.push(r.total);
      if (showYoy) { line.push(pv.prevMap[r.key] == null ? '' : pv.prevMap[r.key]); line.push(yoyOf(r.total, pv.prevMap[r.key])); }
      line.push(pv.totalAll ? Math.round(r.total / pv.totalAll * 10000) / 100 : 0);
      rows.push(line);
    });
    var total = ['合计'];
    pv.colKeys.forEach(function (c) { total.push(pv.totalCols[c]); });
    total.push(pv.totalAll);
    if (showYoy) { total.push(pv.prevTotal); total.push(yoyOf(pv.totalAll, pv.prevTotal)); }
    total.push(100);
    rows.push(total);
    rows.push([]);
    rows.push(['明细（当前筛选全部记录）']);
    rows.push(['日期', '单据编号', '客户', '业务员', '客户属性', '品项类别', '品项明细', '实发数量', '价税合计（折前）']);
    lastPivot.list.forEach(function (r) {
      rows.push([r['日期'], r['单据编号'], r['客户'], r['业务员'], r['客户属性'], r['品项类别'], r['品项明细'], fnum(r['实发数量']), fnum(r['价税合计（折前）'])]);
    });
    saveBlob('分析结果-' + F.rowDim + '-' + stamp() + '.csv', toCsv(rows), 'text/csv;charset=utf-8');
    toast('已导出 CSV（含汇总 + 明细）');
  }

  /* ================= 明细数据 ================= */
  function renderDetail(force) {
    var root = $('#detailRoot');
    if (root.dataset.built && !force) { renderDetailRows(); return; }
    var h = '<div class="wrap"><div class="filters"><div class="frow">' +
      '<div class="fgroup"><label>数据期间</label>' +
      '<button class="pill' + (F.year === 'cur' ? ' on' : '') + '" data-dy="cur">本期（' + esc(state.data.meta.fyLabel) + '）</button>' +
      '<button class="pill' + (F.year === 'prev' ? ' on' : '') + '" data-dy="prev">上年同期</button></div>' +
      '<div class="fgroup"><label>搜索</label><input type="text" id="dKw" placeholder="客户 / 品项 / 单据号，回车筛选" value="' + esc(F.detailKw) + '"></div>' +
      '<div class="fgroup"><label>每页</label><select id="dSize">' +
      [50, 100, 200, 500].map(function (n) { return '<option' + (n === F.detailSize ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select> 行</div>' +
      '<div class="fgroup"><button class="act ghost" id="dCsv">导出筛选结果 CSV</button></div>' +
      '</div></div><div class="card"><h2 id="dTitle">明细数据</h2><div class="desc" id="dDesc"></div><div id="dTable"></div><div class="pager" id="dPager"></div></div></div>';
    root.innerHTML = h;
    root.dataset.built = '1';
    $$('.pill[data-dy]', root).forEach(function (b) {
      b.addEventListener('click', function () { F.year = b.getAttribute('data-dy'); F.detailPage = 1; renderDetail(true); });
    });
    var kw = $('#dKw', root);
    kw.addEventListener('keydown', function (e) { if (e.key === 'Enter') { F.detailKw = kw.value.trim(); F.detailPage = 1; renderDetailRows(); } });
    $('#dSize', root).addEventListener('change', function () { F.detailSize = Number(this.value); F.detailPage = 1; renderDetailRows(); });
    $('#dCsv', root).addEventListener('click', function () {
      var list = detailList();
      var cols = hdrOf(rowsOf(F.year));
      var rows = [cols];
      list.forEach(function (r) { rows.push(cols.map(function (c) { return r[c]; })); });
      saveBlob('出库明细-' + stamp() + '.csv', toCsv(rows), 'text/csv;charset=utf-8');
      toast('已导出 ' + fwi(list.length) + ' 行明细');
    });
    renderDetailRows();
  }

  function detailList() {
    var list = objectsOf(F.year);
    if (!F.detailKw) return list;
    var k = F.detailKw.toLowerCase();
    return list.filter(function (r) {
      return (str(r['客户']) + ' ' + str(r['品项明细']) + ' ' + str(r['单据编号']) + ' ' + str(r['业务员'])).toLowerCase().indexOf(k) >= 0;
    });
  }

  function renderDetailRows() {
    var list = detailList();
    var cols = ['日期', '单据编号', '客户', '业务员', '客户属性', '片区', '品项类别', '品项明细', '实发数量', '价税合计', '价税合计（折前）'];
    var have = hdrOf(rowsOf(F.year));
    cols = cols.filter(function (c) { return have.indexOf(c) >= 0; });
    var total = list.length;
    var pages = Math.max(1, Math.ceil(total / F.detailSize));
    if (F.detailPage > pages) F.detailPage = pages;
    var start = (F.detailPage - 1) * F.detailSize;
    var pageRows = list.slice(start, start + F.detailSize);
    var sum = 0, qty = 0;
    list.forEach(function (r) { sum += fnum(r['价税合计（折前）']); qty += fnum(r['实发数量']); });
    $('#dTitle').textContent = '明细数据 · ' + (F.year === 'cur' ? '本期' : '上年同期') + ' 共 ' + fwi(total) + ' 行';
    $('#dDesc').innerHTML = '折前金额合计 <b>' + fw(sum / 10000) + ' 万</b> · 实发数量合计 <b>' + fwi(qty) + '</b>' +
      (F.detailKw ? ' · 关键词“' + esc(F.detailKw) + '”' : '') + '。数据来自' + esc(state.files[F.year] ? state.files[F.year].name : '内置数据') + '。';
    var h = '<div class="tbl-wrap"><table class="tbl"><tr>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>';
    pageRows.forEach(function (r) {
      h += '<tr>' + cols.map(function (c) {
        var v = r[c];
        if (c.indexOf('价税合计') === 0) return '<td>' + fw(v) + '</td>';
        if (c === '实发数量') return '<td>' + fwi(v) + '</td>';
        return '<td>' + esc(v == null ? '' : v) + '</td>';
      }).join('') + '</tr>';
    });
    h += '</table></div>';
    if (!total) h = '<div class="note">没有符合条件的数据。</div>';
    $('#dTable').innerHTML = h;
    $('#dPager').innerHTML = '<button id="dPrev"' + (F.detailPage <= 1 ? ' disabled' : '') + '>上一页</button>' +
      '<span>第 ' + F.detailPage + ' / ' + pages + ' 页（本页 ' + pageRows.length + ' 行）</span>' +
      '<button id="dNext"' + (F.detailPage >= pages ? ' disabled' : '') + '>下一页</button>';
    var prev = $('#dPrev'), next = $('#dNext');
    if (prev) prev.addEventListener('click', function () { F.detailPage--; renderDetailRows(); });
    if (next) next.addEventListener('click', function () { F.detailPage++; renderDetailRows(); });
  }

  /* ================= 启动 ================= */
  function loadBuiltin() {
    var p = window.__BOARD_PACK__;
    var s = unpackState(p);
    state.files = s.files;
    state.source = p.source || 'builtin';
    state.savedAt = p.savedAt || null;
  }

  function boot() {
    try { loadBuiltin(); } catch (e) {
      document.body.insertAdjacentHTML('afterbegin', '<div style="background:#ffece8;color:#d91f1f;padding:12px 20px">内置数据缺失：' + esc(e.message) + '</div>');
      return;
    }
    refreshAll();
    store.get().then(function (saved) {
      if (saved && saved.files && Object.keys(saved.files).length) {
        try {
          var s = unpackState(saved);
          ORDER.forEach(function (k) { if (s.files[k]) state.files[k] = s.files[k]; });
          state.source = 'upload';
          state.savedAt = saved.savedAt || null;
          refreshAll();
          toast('已载入本机保存的数据（更新于 ' + String(state.savedAt || '').replace('T', ' ').slice(0, 16) + '）', 4000);
        } catch (e) { /* 缓存坏了就用内置 */ }
      }
    });
    $$('.app-tabs button').forEach(function (b) {
      b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
    });
    $('#btnData').addEventListener('click', openDrawer);
    $('#drawerClose').addEventListener('click', closeDrawer);
    $('#drawerMask').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });
    $('#filePick').addEventListener('change', function (e) { handleFiles(e.target.files); e.target.value = ''; });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
